project_id = "garmin-ai"

# No public JWT check at gateway because synchronization uses a separate
# 256-bit shared secret. The function *always* verifies this before work.
[functions.sync-garmin]
verify_jwt = false

[functions.sync-garmin-health]
verify_jwt = false

# JWT is validated inside read-garmin-health for publishable-key projects.
[functions.read-garmin-health]
verify_jwt = false

[functions.backfill-garmin-history]
verify_jwt = false

[functions.backfill-garmin-details]
verify_jwt = false

# Auth JWT verified inside this private function.
[functions.read-garmin-session]
verify_jwt = false

[functions.sync-garmin-hr-profile]
verify_jwt = false

# Owner JWT verified inside the private Edge Function.
[functions.read-garmin-aerobic]
verify_jwt = false

# v0.7.5: JWT validated by the private sync-center function with auth.getUser,
# owner e-mail checked on every request. Required for publishable-key projects.
[functions.garmin-sync-center]
verify_jwt = false

# One-time owner-only Garmin OAuth bootstrap. Function itself verifies the
# logged-in owner via Supabase Auth and stores tokens only in Vault.
[functions.garmin-connect-bootstrap]
verify_jwt = false
