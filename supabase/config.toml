project_id = "garmin-ai"

# No public JWT check at gateway because synchronization uses a separate
# 256-bit shared secret. The function *always* verifies this before work.
[functions.sync-garmin]
verify_jwt = false

[functions.sync-garmin-health]
verify_jwt = false

# JWT is validated inside read-garmin-health for publishable-key projects.
[functions.read-garmin-health]
verify_jwt = false

[functions.backfill-garmin-history]
verify_jwt = false

[functions.backfill-garmin-details]
verify_jwt = false

# Auth JWT verified inside this private function.
[functions.read-garmin-session]
verify_jwt = false

[functions.sync-garmin-hr-profile]
verify_jwt = false
