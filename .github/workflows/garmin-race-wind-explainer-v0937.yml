name: GARMIN_AI Race Wind Explainer
on:
  push:
    paths:
      - 'src/components/RaceForecastCompact.tsx'
      - 'src/lib/raceWindExplain.mjs'
      - 'src/lib/raceWindExplain.d.mts'
      - 'src/styles/race-forecast-compact.css'
      - 'tests/mobile-race-wind-explainer-v0937.test.mjs'
      - '.github/workflows/garmin-race-wind-explainer-v0937.yml'
  pull_request:
    paths:
      - 'src/components/RaceForecastCompact.tsx'
      - 'src/lib/raceWindExplain.mjs'
      - 'src/lib/raceWindExplain.d.mts'
      - 'src/styles/race-forecast-compact.css'
      - 'tests/mobile-race-wind-explainer-v0937.test.mjs'
      - '.github/workflows/garmin-race-wind-explainer-v0937.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/mobile-race-wind-explainer-v0937.test.mjs tests/mobile-race-event-dossier-komoot-v0936.test.mjs tests/mobile-race-goals-weather-gpx-v0935.test.mjs tests/mobile-weather-intelligence.test.mjs tests/mobile-clean-coach.test.mjs
      - run: npm run build
