name: GARMIN_AI OAuth Rate Limit Guard v0.9.46
on:
  push:
    paths:
      - 'supabase/functions/_shared/garmin-cloud-backoff.mjs'
      - 'supabase/functions/garmin-cloud-worker/index.ts'
      - 'supabase/functions/garmin-sync-center/index.ts'
      - 'supabase/migrations/20261112173000_garmin_cloud_oauth_backoff.sql'
      - 'scripts/cloud/sync-garmin-gear.mjs'
      - 'scripts/cloud/audit-garmin-connect.mjs'
      - 'src/components/SyncCenter.tsx'
      - 'src/styles/sync-center.css'
      - 'tests/garmin-cloud-oauth-backoff-v0946.test.mjs'
      - '.github/workflows/garmin-oauth-backoff-v0946.yml'
  pull_request:
    paths:
      - 'supabase/functions/_shared/garmin-cloud-backoff.mjs'
      - 'supabase/functions/garmin-cloud-worker/index.ts'
      - 'supabase/functions/garmin-sync-center/index.ts'
      - 'supabase/migrations/20261112173000_garmin_cloud_oauth_backoff.sql'
      - 'scripts/cloud/sync-garmin-gear.mjs'
      - 'scripts/cloud/audit-garmin-connect.mjs'
      - 'src/components/SyncCenter.tsx'
      - 'src/styles/sync-center.css'
      - 'tests/garmin-cloud-oauth-backoff-v0946.test.mjs'
      - '.github/workflows/garmin-oauth-backoff-v0946.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/garmin-cloud-oauth-backoff-v0946.test.mjs tests/garmin-incremental-gear-v0945.test.mjs tests/garmin-gear-cloud-guards-v0945.test.mjs tests/garmin-cloud-data-audit.test.mjs tests/garmin-cloud-session.test.mjs tests/garmin-worker-claims.test.mjs tests/mobile-session-coach-consistency-v0943.test.mjs tests/mobile-aerobic-cors-and-sync-clarity-v0942.test.mjs
      - run: npm run build
