# Single-purpose bootstrap workflow on main; does NOT merge the
# unfinished GARMIN_AI development stack into the default branch.
# Only manual runs are enabled. No cron until the cloud audit is proven.
name: GARMIN_AI Cloud Read-Only Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: garmin-ai-cloud-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Verify Garmin Connect Cloud gear and calendar
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact reviewed cloud audit version
        uses: actions/checkout@v4
        with:
          ref: 7b53cf46bb6edeba68e654991324f29a331d7148
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test audit and OIDC access guards
        run: node --test tests/garmin-cloud-data-audit.test.mjs tests/garmin-worker-claims.test.mjs tests/garmin-cloud-session.test.mjs tests/garmin-cloud-audit-diagnostic.test.mjs

      - name: Read Garmin Connect via Supabase OIDC bridge
        run: node scripts/cloud/audit-garmin-connect.mjs
