name: GARMIN_AI Cloud Read-Only Audit

on:
  workflow_dispatch:
  # Scheduled runs are disabled until explicitly enabled via repository
  # variable GARMIN_CLOUD_AUDIT_ENABLED=true after a successful manual audit.
  schedule:
    - cron: '37 5 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: garmin-cloud-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only Garmin gear and calendar verification
    # Never run as a pull request. Runs on main only, and only after opt-in.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       vars.GARMIN_CLOUD_AUDIT_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test cloud audit guards
        run: node --test tests/garmin-cloud-data-audit.test.mjs tests/garmin-worker-claims.test.mjs
      - name: Read Garmin from GitHub-hosted Node via verified OIDC
        run: node scripts/cloud/audit-garmin-connect.mjs
