# Single-purpose bootstrap workflow on main; does NOT merge the
# unfinished GARMIN_AI development stack into the default branch.
# Read-only daily sync; OAuth cooldown prevents repeated Garmin authentication.
name: GARMIN_AI Cloud Read-Only Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/garmin-cloud-audit.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: garmin-ai-cloud-audit
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v7
        with:
          ref: d6d7659e55e0fbdfb0b550c2c8a876fb0f4a6a4c
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test OAuth 429 guard and audit safety
        run: node --test tests/garmin-cloud-429-guard.test.mjs tests/garmin-cloud-data-audit.test.mjs tests/garmin-worker-claims.test.mjs tests/garmin-cloud-session.test.mjs tests/garmin-cloud-audit-diagnostic.test.mjs tests/garmin-cloud-snapshot-auto-sync.test.mjs
      - run: npm run build

  audit:
    name: Sync Garmin gear/calendar (read-only on Garmin)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact reviewed cloud audit version
        uses: actions/checkout@v4
        with:
          ref: d6d7659e55e0fbdfb0b550c2c8a876fb0f4a6a4c
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test audit and OIDC access guards
        run: node --test tests/garmin-cloud-data-audit.test.mjs tests/garmin-worker-claims.test.mjs tests/garmin-cloud-session.test.mjs tests/garmin-cloud-audit-diagnostic.test.mjs tests/garmin-cloud-snapshot-auto-sync.test.mjs

      - name: Read Garmin Connect and update validated private Supabase snapshot
        run: node scripts/cloud/audit-garmin-connect.mjs
