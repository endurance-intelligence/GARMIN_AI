name: GARMIN_AI Incremental Gear Cloud v0.9.45
on:
  push:
    paths:
      - 'supabase/functions/_shared/garmin-gear-incremental.mjs'
      - 'supabase/functions/garmin-cloud-worker/index.ts'
      - 'scripts/cloud/sync-garmin-gear.mjs'
      - '.github/workflows/garmin-cloud-audit.yml'
      - 'src/components/GarminConnectSnapshot.tsx'
      - 'src/pages/GearPage.tsx'
      - 'src/styles/garmin-connect-snapshot.css'
      - 'tests/garmin-incremental-gear-v0945.test.mjs'
      - 'tests/garmin-gear-cloud-guards-v0945.test.mjs'
      - '.github/workflows/garmin-incremental-gear-v0945.yml'
  pull_request:
    paths:
      - 'supabase/functions/_shared/garmin-gear-incremental.mjs'
      - 'supabase/functions/garmin-cloud-worker/index.ts'
      - 'scripts/cloud/sync-garmin-gear.mjs'
      - '.github/workflows/garmin-cloud-audit.yml'
      - 'src/components/GarminConnectSnapshot.tsx'
      - 'src/pages/GearPage.tsx'
      - 'src/styles/garmin-connect-snapshot.css'
      - 'tests/garmin-incremental-gear-v0945.test.mjs'
      - 'tests/garmin-gear-cloud-guards-v0945.test.mjs'
      - '.github/workflows/garmin-incremental-gear-v0945.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/garmin-incremental-gear-v0945.test.mjs tests/garmin-gear-cloud-guards-v0945.test.mjs tests/garmin-worker-claims.test.mjs tests/garmin-cloud-data-audit.test.mjs tests/garmin-cloud-session.test.mjs tests/mobile-gear-photos-coach-ux-v0944.test.mjs
      - run: npm run build
