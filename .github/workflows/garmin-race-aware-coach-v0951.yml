name: GARMIN_AI Race-Aware Coach v0.9.51
on:
  push:
    paths:
      - 'src/lib/coachSevenDay.mjs'
      - 'src/lib/coachSevenDay.d.mts'
      - 'src/lib/coachSnapshot.ts'
      - 'src/pages/CalendarPage.tsx'
      - 'src/components/CalendarWeekBoard.tsx'
      - 'src/styles/horizon-calendar.css'
      - 'src/styles/calendar-week-board.css'
      - 'supabase/functions/garmin-training-plan/index.ts'
      - 'tests/race-aware-coach-taper-v0951.test.mjs'
      - 'tests/mobile-coach-seven-day-v1.test.mjs'
      - '.github/workflows/garmin-race-aware-coach-v0951.yml'
  pull_request:
    paths:
      - 'src/lib/coachSevenDay.mjs'
      - 'src/lib/coachSevenDay.d.mts'
      - 'src/lib/coachSnapshot.ts'
      - 'src/pages/CalendarPage.tsx'
      - 'src/components/CalendarWeekBoard.tsx'
      - 'src/styles/horizon-calendar.css'
      - 'src/styles/calendar-week-board.css'
      - 'supabase/functions/garmin-training-plan/index.ts'
      - 'tests/race-aware-coach-taper-v0951.test.mjs'
      - 'tests/mobile-coach-seven-day-v1.test.mjs'
      - '.github/workflows/garmin-race-aware-coach-v0951.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/race-aware-coach-taper-v0951.test.mjs tests/mobile-coach-seven-day-v1.test.mjs tests/mobile-coach-life-context-v11.test.mjs tests/mobile-coach-calendar-v0948.test.mjs tests/mobile-coach-week-batch-v0950.test.mjs tests/coach-structured-intervals-v0947.test.mjs tests/coach-normalmode-missing-row-v0949.test.mjs tests/intervals-bridge.test.mjs tests/mobile-calendar-week-board.test.mjs tests/mobile-horizon-calendar.test.mjs tests/mobile-calendar-delete-fix-v0930.test.mjs
      - run: npm run build
