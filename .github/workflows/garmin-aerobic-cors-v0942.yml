name: GARMIN_AI Aerobic + Calendar Status v0.9.42
on:
  push:
    paths:
      - 'src/components/SyncCenter.tsx'
      - 'src/styles/sync-center.css'
      - 'supabase/functions/read-garmin-aerobic/index.ts'
      - 'supabase/functions/read-garmin-aerobic/corsPolicy.mjs'
      - 'tests/mobile-aerobic-cors-and-sync-clarity-v0942.test.mjs'
      - '.github/workflows/garmin-aerobic-cors-v0942.yml'
  pull_request:
    paths:
      - 'src/components/SyncCenter.tsx'
      - 'src/styles/sync-center.css'
      - 'supabase/functions/read-garmin-aerobic/index.ts'
      - 'supabase/functions/read-garmin-aerobic/corsPolicy.mjs'
      - 'tests/mobile-aerobic-cors-and-sync-clarity-v0942.test.mjs'
      - '.github/workflows/garmin-aerobic-cors-v0942.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/mobile-aerobic-cors-and-sync-clarity-v0942.test.mjs tests/mobile-web-policy.test.mjs tests/intervals-bridge.test.mjs
      - run: npm run build
