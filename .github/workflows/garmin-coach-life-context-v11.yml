name: GARMIN_AI Coach Illness + Availability v1.1
on:
  push:
    paths:
      - 'src/components/CoachSevenDay.tsx'
      - 'src/components/CoachLifeContext.tsx'
      - 'src/styles/coach-life-context.css'
      - 'src/lib/coachSevenDay.mjs'
      - 'src/lib/coachSevenDay.d.mts'
      - 'src/components/Icon.tsx'
      - 'supabase/functions/garmin-coach-context/index.ts'
      - 'supabase/migrations/20261112110000_coach_illness_unavailable_v11.sql'
      - 'tests/mobile-coach-life-context-v11.test.mjs'
      - '.github/workflows/garmin-coach-life-context-v11.yml'
  pull_request:
    paths:
      - 'src/components/CoachSevenDay.tsx'
      - 'src/components/CoachLifeContext.tsx'
      - 'src/styles/coach-life-context.css'
      - 'src/lib/coachSevenDay.mjs'
      - 'src/lib/coachSevenDay.d.mts'
      - 'src/components/Icon.tsx'
      - 'supabase/functions/garmin-coach-context/index.ts'
      - 'supabase/migrations/20261112110000_coach_illness_unavailable_v11.sql'
      - 'tests/mobile-coach-life-context-v11.test.mjs'
      - '.github/workflows/garmin-coach-life-context-v11.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/mobile-coach-seven-day-v1.test.mjs tests/mobile-coach-life-context-v11.test.mjs tests/mobile-no-tab-reload-v0941.test.mjs tests/mobile-web-policy.test.mjs
      - run: npm run build
