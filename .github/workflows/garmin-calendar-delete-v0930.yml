name: GARMIN_AI Calendar UX and Deletion
on:
  push:
    paths:
      - 'src/pages/CalendarPage.tsx'
      - 'src/components/CalendarWeekBoard.tsx'
      - 'src/components/WeeklyTrainingOptions.tsx'
      - 'src/lib/movementSession.ts'
      - 'src/styles/horizon-calendar.css'
      - 'supabase/functions/garmin-intervals/**'
      - 'supabase/functions/garmin-training-plan/**'
      - 'tests/mobile-calendar-delete-fix-v0930.test.mjs'
      - '.github/workflows/garmin-calendar-delete-v0930.yml'
  pull_request:
    paths:
      - 'src/pages/CalendarPage.tsx'
      - 'src/components/CalendarWeekBoard.tsx'
      - 'src/components/WeeklyTrainingOptions.tsx'
      - 'src/lib/movementSession.ts'
      - 'src/styles/horizon-calendar.css'
      - 'supabase/functions/garmin-intervals/**'
      - 'supabase/functions/garmin-training-plan/**'
      - 'tests/mobile-calendar-delete-fix-v0930.test.mjs'
      - '.github/workflows/garmin-calendar-delete-v0930.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/mobile-calendar-delete-fix-v0930.test.mjs tests/mobile-calendar-completion-bodyweight.test.mjs tests/mobile-calendar-week-board.test.mjs tests/mobile-horizon-calendar.test.mjs tests/mobile-stabi-studio.test.mjs tests/intervals-bridge.test.mjs tests/mobile-weekly-training-options.test.mjs
      - run: npm run build
