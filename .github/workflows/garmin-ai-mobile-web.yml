name: GARMIN_AI Mobile Web (GitHub Pages)

on:
  workflow_dispatch:
  # Review PRs must pass Node tests + production build BEFORE merging.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/garmin-ai-mobile-web.yml'
  # Reviewed release merge triggers Pages deployment automatically.
  push:
    branches: [main]
    paths:
      - '.github/workflows/garmin-ai-mobile-web.yml'

permissions:
  contents: read

concurrency:
  group: garmin-ai-pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITHUB_PAGES: 'true'
      VITE_GARMIN_SUPABASE_URL: https://eurgupsebxypjqvyizci.supabase.co
      VITE_GARMIN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.GARMIN_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout reviewed mobile build
        uses: actions/checkout@v7
        with:
          ref: 9202abdd4589e3d85a9dba27a049522841ce6497
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify mobile access, calendar layout and weight-picker tests
        run: node --test tests/mobile-web-policy.test.mjs tests/mobile-first-polish.test.mjs tests/mobile-weight-picker.test.mjs tests/mobile-ipad-ux.test.mjs tests/compact-weight-card.test.mjs tests/mobile-horizon-calendar.test.mjs tests/mobile-weather-intelligence.test.mjs tests/mobile-clean-coach.test.mjs tests/mobile-recovery-context.test.mjs tests/mobile-recovery-sparklines.test.mjs tests/mobile-orc-track-workout.test.mjs tests/mobile-dynamic-workout-archive.test.mjs tests/mobile-workout-archive-navigation.test.mjs tests/mobile-photo-import-diagnostics.test.mjs tests/mobile-photo-429-quotas.test.mjs tests/mobile-free-photo-ocr.test.mjs tests/mobile-ocr-structured-editor.test.mjs tests/mobile-track-lap-group-picker.test.mjs tests/mobile-single-workout-dialog.test.mjs tests/mobile-spatial-ocr.test.mjs tests/mobile-workout-step-modes.test.mjs tests/intervals-bridge.test.mjs tests/mobile-weekly-training-options.test.mjs tests/mobile-stabi-studio.test.mjs tests/mobile-calendar-week-board.test.mjs tests/mobile-calendar-completion-bodyweight.test.mjs tests/mobile-calendar-delete-fix-v0930.test.mjs tests/mobile-coach-goal-weather-v0931.test.mjs tests/mobile-race-event-research-v0932.test.mjs tests/mobile-race-venue-address-v0933.test.mjs tests/mobile-event-archive-logo-autocomplete-v0934.test.mjs tests/mobile-race-goals-weather-gpx-v0935.test.mjs tests/mobile-race-event-dossier-komoot-v0936.test.mjs tests/mobile-race-wind-explainer-v0937.test.mjs tests/mobile-intervals-manual-delete-v0938.test.mjs tests/mobile-race-course-weather-persist-v0939.test.mjs tests/mobile-race-forecast-share-v0940.test.mjs tests/mobile-no-tab-reload-v0941.test.mjs tests/mobile-coach-seven-day-v1.test.mjs tests/mobile-coach-life-context-v11.test.mjs tests/mobile-hr-profile-cors-v0624.test.mjs tests/mobile-aerobic-cors-and-sync-clarity-v0942.test.mjs
      - name: Build iPhone/iPad release
        run: npm run build
      - name: Verify GitHub Pages paths
        run: grep -q '/GARMIN_AI/assets/' dist/index.html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GITHUB_PAGES: 'true'
      VITE_GARMIN_SUPABASE_URL: https://eurgupsebxypjqvyizci.supabase.co
      # Public/publishable client key only. Never use a service-role/secret key.
      VITE_GARMIN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.GARMIN_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check out exact reviewed mobile release
        uses: actions/checkout@v7
        with:
          ref: 9202abdd4589e3d85a9dba27a049522841ce6497
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Check public Supabase key is configured safely
        shell: bash
        run: |
          if [ -z "$VITE_GARMIN_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing GitHub Actions repository VARIABLE: GARMIN_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          if [[ "$VITE_GARMIN_SUPABASE_PUBLISHABLE_KEY" == sb_secret_* ]]; then
            echo "Refusing to embed a private Supabase key into a public site"
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify mobile access controls
        run: node --test tests/mobile-web-policy.test.mjs tests/mobile-first-polish.test.mjs tests/mobile-weight-picker.test.mjs tests/mobile-ipad-ux.test.mjs tests/compact-weight-card.test.mjs tests/mobile-horizon-calendar.test.mjs tests/mobile-weather-intelligence.test.mjs tests/mobile-clean-coach.test.mjs tests/mobile-recovery-context.test.mjs tests/mobile-recovery-sparklines.test.mjs tests/mobile-orc-track-workout.test.mjs tests/mobile-dynamic-workout-archive.test.mjs tests/mobile-workout-archive-navigation.test.mjs tests/mobile-photo-import-diagnostics.test.mjs tests/mobile-photo-429-quotas.test.mjs tests/mobile-free-photo-ocr.test.mjs tests/mobile-ocr-structured-editor.test.mjs tests/mobile-track-lap-group-picker.test.mjs tests/mobile-single-workout-dialog.test.mjs tests/mobile-spatial-ocr.test.mjs tests/mobile-workout-step-modes.test.mjs tests/intervals-bridge.test.mjs tests/mobile-weekly-training-options.test.mjs tests/mobile-stabi-studio.test.mjs tests/mobile-calendar-week-board.test.mjs tests/mobile-calendar-completion-bodyweight.test.mjs tests/mobile-calendar-delete-fix-v0930.test.mjs tests/mobile-coach-goal-weather-v0931.test.mjs tests/mobile-race-event-research-v0932.test.mjs tests/mobile-race-venue-address-v0933.test.mjs tests/mobile-event-archive-logo-autocomplete-v0934.test.mjs tests/mobile-race-goals-weather-gpx-v0935.test.mjs tests/mobile-race-event-dossier-komoot-v0936.test.mjs tests/mobile-race-wind-explainer-v0937.test.mjs tests/mobile-intervals-manual-delete-v0938.test.mjs tests/mobile-race-course-weather-persist-v0939.test.mjs tests/mobile-race-forecast-share-v0940.test.mjs tests/mobile-no-tab-reload-v0941.test.mjs tests/mobile-coach-seven-day-v1.test.mjs tests/mobile-coach-life-context-v11.test.mjs tests/mobile-hr-profile-cors-v0624.test.mjs tests/mobile-aerobic-cors-and-sync-clarity-v0942.test.mjs

      - name: Build GitHub Pages app
        run: npm run build

      - name: Confirm GitHub Pages base
        run: grep -q '/GARMIN_AI/assets/' dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
