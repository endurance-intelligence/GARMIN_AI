name: GARMIN_AI Mobile Web (GitHub Pages)

on:
  workflow_dispatch:
  # Review PRs must pass Node tests + production build BEFORE merging.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/garmin-ai-mobile-web.yml'
  # Reviewed release merge triggers Pages deployment automatically.
  push:
    branches: [main]
    paths:
      - '.github/workflows/garmin-ai-mobile-web.yml'

permissions:
  contents: read

concurrency:
  group: garmin-ai-pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITHUB_PAGES: 'true'
      VITE_GARMIN_SUPABASE_URL: https://eurgupsebxypjqvyizci.supabase.co
      VITE_GARMIN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.GARMIN_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout reviewed mobile build
        uses: actions/checkout@v7
        with:
          ref: da88a170fc40283869fcb5f8e65d5de9a069c3a5
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify mobile access, calendar layout and weight-picker tests
        run: node --test tests/mobile-web-policy.test.mjs tests/mobile-first-polish.test.mjs tests/mobile-weight-picker.test.mjs tests/mobile-ipad-ux.test.mjs tests/compact-weight-card.test.mjs tests/mobile-horizon-calendar.test.mjs tests/mobile-weather-intelligence.test.mjs tests/mobile-clean-coach.test.mjs
      - name: Build iPhone/iPad release
        run: npm run build
      - name: Verify GitHub Pages paths
        run: grep -q '/GARMIN_AI/assets/' dist/index.html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GITHUB_PAGES: 'true'
      VITE_GARMIN_SUPABASE_URL: https://eurgupsebxypjqvyizci.supabase.co
      # Public/publishable client key only. Never use a service-role/secret key.
      VITE_GARMIN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.GARMIN_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check out exact reviewed mobile release
        uses: actions/checkout@v7
        with:
          ref: da88a170fc40283869fcb5f8e65d5de9a069c3a5
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Check public Supabase key is configured safely
        shell: bash
        run: |
          if [ -z "$VITE_GARMIN_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing GitHub Actions repository VARIABLE: GARMIN_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          if [[ "$VITE_GARMIN_SUPABASE_PUBLISHABLE_KEY" == sb_secret_* ]]; then
            echo "Refusing to embed a private Supabase key into a public site"
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify mobile access controls
        run: node --test tests/mobile-web-policy.test.mjs tests/mobile-first-polish.test.mjs tests/mobile-weight-picker.test.mjs tests/mobile-ipad-ux.test.mjs tests/compact-weight-card.test.mjs tests/mobile-horizon-calendar.test.mjs tests/mobile-weather-intelligence.test.mjs tests/mobile-clean-coach.test.mjs

      - name: Build GitHub Pages app
        run: npm run build

      - name: Confirm GitHub Pages base
        run: grep -q '/GARMIN_AI/assets/' dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
