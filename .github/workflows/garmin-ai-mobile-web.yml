name: GARMIN_AI Production · CI and GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garmin-ai-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test full production source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    env:
      GITHUB_PAGES: 'true'
      VITE_GARMIN_SUPABASE_URL: https://eurgupsebxypjqvyizci.supabase.co
      VITE_GARMIN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.GARMIN_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout the exact proposed/committed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify client credentials are public-only
        shell: bash
        run: |
          if [ -z "$VITE_GARMIN_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing repository variable GARMIN_SUPABASE_PUBLISHABLE_KEY" >&2
            exit 1
          fi
          if [[ "$VITE_GARMIN_SUPABASE_PUBLISHABLE_KEY" == sb_secret_* ]]; then
            echo "Refusing to bundle an API secret in publicly served JavaScript" >&2
            exit 1
          fi
          node scripts/validate-public-config.mjs
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test all maintained integration, UI and security contracts
        run: node --test tests/*.test.mjs
      - name: Build GitHub Pages app
        run: npm run build
      - name: Validate Pages base path
        run: grep -q '/GARMIN_AI/assets/' dist/index.html
      - name: Install isolated browser smoke tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/garmin-smoke" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/garmin-smoke/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser smoke against production build (isolated fixtures)
        env:
          SMOKE_TOOLS_DIR: ${{ runner.temp }}/garmin-smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/garmin-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/GARMIN_AI/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-smoke.mjs
      - name: Verify live private API denies anonymous and invalid sessions
        run: node scripts/security-live-read-smoke.mjs
      # Upload the verified build ONCE, in the verification job. Separating
      # upload and deployment avoids the GitHub artifact-indexing race and
      # prevents duplicate "github-pages" artifacts when deploy is retried.
      - name: Prepare GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload verified static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish verified main commit to Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified static site
        id: deployment
        uses: actions/deploy-pages@v4
