name: GARMIN_AI Event Archive and Autocomplete
on:
  push:
    paths:
      - 'src/components/RaceEventResearch.tsx'
      - 'src/components/VenueAutocomplete.tsx'
      - 'src/components/CoachGoalPanel.tsx'
      - 'src/pages/RacePage.tsx'
      - 'supabase/functions/garmin-race-research/**'
      - 'supabase/functions/_shared/race-event-archive.mjs'
      - 'supabase/functions/_shared/race-event-extract.mjs'
      - 'tests/mobile-event-archive-logo-autocomplete-v0934.test.mjs'
      - '.github/workflows/garmin-event-archive-v0934.yml'
  pull_request:
    paths:
      - 'src/components/RaceEventResearch.tsx'
      - 'src/components/VenueAutocomplete.tsx'
      - 'src/components/CoachGoalPanel.tsx'
      - 'src/pages/RacePage.tsx'
      - 'supabase/functions/garmin-race-research/**'
      - 'supabase/functions/_shared/race-event-archive.mjs'
      - 'supabase/functions/_shared/race-event-extract.mjs'
      - 'tests/mobile-event-archive-logo-autocomplete-v0934.test.mjs'
      - '.github/workflows/garmin-event-archive-v0934.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/mobile-event-archive-logo-autocomplete-v0934.test.mjs tests/mobile-race-venue-address-v0933.test.mjs tests/mobile-race-event-research-v0932.test.mjs tests/mobile-coach-goal-weather-v0931.test.mjs
      - run: npm run build
