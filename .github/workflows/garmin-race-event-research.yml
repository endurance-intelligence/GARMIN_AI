name: GARMIN_AI Event Scout
on:
  push:
    paths:
      - 'supabase/functions/garmin-race-research/**'
      - 'supabase/functions/_shared/race-event-extract.mjs'
      - 'src/components/RaceEventResearch.tsx'
      - 'src/pages/RacePage.tsx'
      - 'src/styles/race-event-research.css'
      - 'tests/mobile-race-event-research-v0932.test.mjs'
      - '.github/workflows/garmin-race-event-research.yml'
  pull_request:
    paths:
      - 'supabase/functions/garmin-race-research/**'
      - 'supabase/functions/_shared/race-event-extract.mjs'
      - 'src/components/RaceEventResearch.tsx'
      - 'src/pages/RacePage.tsx'
      - 'src/styles/race-event-research.css'
      - 'tests/mobile-race-event-research-v0932.test.mjs'
      - '.github/workflows/garmin-race-event-research.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/mobile-race-event-research-v0932.test.mjs tests/mobile-coach-goal-weather-v0931.test.mjs
      - run: npm run build
